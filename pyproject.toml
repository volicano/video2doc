[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "video2doc"
version = "0.1.0"
description = "Turn interview and tutorial videos into illustrated HTML tutorials."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "video2doc contributors" }]
keywords = ["video", "asr", "whisper", "subtitle", "tutorial", "bilibili", "youtube"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
  "Topic :: Text Processing :: Markup",
]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.6",
  "httpx>=0.27",
  "yt-dlp>=2024.4.9",
  "numpy>=1.26",
  "pillow>=10.2",
  "markdown-it-py>=3",
]

[project.optional-dependencies]
# 本地语音识别（离线、免费）
local = ["faster-whisper>=1.0.3"]
# 云端语音识别（OpenAI 及任何兼容 /audio/transcriptions 的服务）
cloud = ["httpx>=0.27"]
# 画面文字识别（PP-OCR 模型的 ONNX 版，离线、无需 paddlepaddle）
ocr = ["rapidocr-onnxruntime>=1.3.24"]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
v2doc = "video2doc.cli:main"

[project.urls]
Homepage = "https://github.com/video2doc/video2doc"
Repository = "https://github.com/video2doc/video2doc"
Issues = "https://github.com/video2doc/video2doc/issues"
Changelog = "https://github.com/video2doc/video2doc/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/video2doc"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
